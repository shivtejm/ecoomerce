spring.application.name=RegisterPage

# Use 127.0.0.1 instead of localhost to prevent Windows IPv6 resolution latency
# Auto-create database if not exists, disable SSL overhead for localhost
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/registerdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# HikariCP Pool Configuration: pre-warm idle connections on startup so first request is instant
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

